<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Titan1um - Web-based x86 Emulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0; padding: 0; background: #000; color: #ccc;
    font-family: monospace; height: 100%; overflow: hidden;
    display: flex; flex-direction: column;
  }
  
  #topbar {
    display: flex; gap: 6px; align-items: center; padding: 6px 10px;
    background: #111; border-bottom: 1px solid #333;
    flex-wrap: wrap; font-size: 12px; flex-shrink: 0;
    transition: transform 0.2s ease;
    z-index: 10000;
  }
  
  #topbar button, #topbar select, #topbar input[type=number], #topbar input[type=text] {
    padding: 4px 8px; background: #222; color: #ddd;
    border: 1px solid #444; cursor: pointer; font-size: 12px;
  }
  #topbar button:hover:not(:disabled) { background: #333; border-color: #666; }
  #topbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #topbar label { color: #888; margin-left: 4px; }
  #brand { font-weight: bold; color: #4ea8de; letter-spacing: 1px; margin-right: 10px; font-size: 14px; }
  #status { color: #ffaa00; margin-left: auto; font-weight: bold; }
  
  /* CD 弹出面板 */
  #cd_panel_overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 20000;
    align-items: center; justify-content: center;
  }
  #cd_panel {
    background: #111; border: 1px solid #444; border-radius: 8px;
    padding: 16px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #cd_panel h3 { margin: 0 0 12px 0; color: #4ea8de; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 8px;}
  
  .cd-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid #222;
  }
  .cd-row label { width: 50px; color: #888; }
  .cd-row span { flex: 1; color: #4ea8de; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  
  #dl_toggle { padding: 4px 10px; background: #222; color: #ddd; border: 1px solid #444; cursor: pointer; font-size: 12px; }
  #dl_toggle:hover { background: #333; }
  #dl_panel { display: none; background: #0a0a0a; border-bottom: 1px solid #333; flex-shrink: 0; height: 400px; }
  #dl_panel iframe { width: 100%; height: 100%; border: 0; display: block; }
  
  /* ---- 屏幕区域 ---- */
  #screen_wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden; position: relative;
  }
  #screen_container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  
  #screen_container > div { display: none !important; }
  
  #screen_container > canvas {
    display: block; background: #000;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    max-width: 100%; max-height: 100%; object-fit: contain;
  }

  body.is-fullscreen #topbar { position: fixed; top: -100px; left: 0; right: 0; }
  body.is-fullscreen #topbar:hover { transform: translateY(100px); }
  body.is-fullscreen #screen_wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; cursor: none; }
  body.is-fullscreen.show-cursor #screen_wrap { cursor: default; }

  .hidden-file { display: none; }
  .file-btn {
    padding: 4px 8px; background: #222; color: #ddd; border: 1px solid #444; cursor: pointer; font-size: 11px; font-family: monospace;
  }
  .file-btn:hover { background: #333; border-color: #666; }
</style>
</head>
<body>
  
  <div id="topbar">
    <div id="brand" title="Titan1um Emulator">Titan1um</div>
    
    <label>OS:</label>
    <select id="category_select" title="Select OS Category">
      <option value="windows">Windows</option>
      <option value="linux">Linux</option>
      <option value="other">Other</option>
    </select>
    <select id="os_preset" title="Select specific OS profile"></select>

    <label>HDA (C:):</label>
    <button class="file-btn" onclick="document.getElementById('hda_file').click()">Load</button>
    <input type="file" id="hda_file" class="hidden-file">
    <span id="hda_name" style="color:#4ea8de; font-size:11px; max-width:60px; overflow:hidden; text-overflow:ellipsis;">(none)</span>

    <label>DATA (D:):</label>
    <button class="file-btn" onclick="document.getElementById('hdb_file').click()">Load</button>
    <input type="file" id="hdb_file" class="hidden-file">
    <span id="hdb_name" style="color:#4ea8de; font-size:11px; max-width:60px; overflow:hidden; text-overflow:ellipsis;">(none)</span>

    <label>RAM:</label>
    <input type="number" id="mem_size" value="128" min="16" max="1024" step="16" style="width:50px" title="Memory size in MB">

    <label>Scale:</label>
    <select id="scale_select" title="Force integer scaling">
      <option value="fit">Fit (Keep Aspect)</option>
      <option value="1">1x (Original)</option>
      <option value="2">2x</option>
      <option value="3">3x</option>
    </select>

    <button id="btn_cd_menu" class="file-btn" title="Manage CD-ROMs">CDs (0/10)</button>

    <button id="btn_start" title="Power On / Resume">Start</button>
    <button id="btn_pause" title="Pause">Pause</button>
    <button id="btn_stop" title="Power Off">Stop</button>
    <button id="btn_restart" title="Apply Changes & Hard Reset">Restart</button>
    
    <button id="btn_save" title="Download State">Save State</button>
    <input type="file" id="state_file" class="hidden-file" accept=".bin">
    <button id="btn_load" title="Load State">Load State</button>
    
    <button id="btn_fullscreen" title="Toggle Fullscreen">Theater Mode</button>
    <button id="dl_toggle" title="Downloads">Images ▼</button>
    <span id="status">Ready</span>
  </div>

  <div id="dl_panel">
    <iframe id="dl_frame" src="downloader.html"></iframe>
  </div>

  <div id="screen_wrap">
    <div id="screen_container"></div>
  </div>

  <div id="cd_panel_overlay">
    <div id="cd_panel">
      <h3>CD-ROM Slots</h3>
      <div id="cd_slots_container"></div>
      <div style="text-align: right; margin-top: 12px;">
        <button class="file-btn" onclick="document.getElementById('cd_panel_overlay').style.display='none'">Close</button>
      </div>
    </div>
  </div>

<script src="libv86.js"></script>
<script>
var emulator = null;
var statusEl = document.getElementById("status");
var screenContainer = document.getElementById("screen_container");
var screenWrap = document.getElementById("screen_wrap");
var btnStart = document.getElementById("btn_start");
var btnPause = document.getElementById("btn_pause");
var btnStop = document.getElementById("btn_stop");
var btnRestart = document.getElementById("btn_restart");
var btnSave = document.getElementById("btn_save");
var btnLoad = document.getElementById("btn_load");
var btnFullscreen = document.getElementById("btn_fullscreen");
var btnCdMenu = document.getElementById("btn_cd_menu");
var hdaInput = document.getElementById("hda_file");
var hdaName = document.getElementById("hda_name");
var hdbInput = document.getElementById("hdb_file");
var hdbName = document.getElementById("hdb_name");
var memInput = document.getElementById("mem_size");
var stateInput = document.getElementById("state_file");
var categorySelect = document.getElementById("category_select");
var presetSelect = document.getElementById("os_preset");
var scaleSelect = document.getElementById("scale_select");
var dlToggle = document.getElementById("dl_toggle");
var dlPanel = document.getElementById("dl_panel");
var cdSlotsContainer = document.getElementById("cd_slots_container");
var cdPanelOverlay = document.getElementById("cd_panel_overlay");

var currentHda = null;
var currentHdb = null;
var currentProfile = null;

var cdSlots = Array.from({ length: 10 }, () => ({ file: null, input: null, nameEl: null, btnEject: null }));

var SYSTEMS = {
  windows: [
    { id: "win95", name: "Windows 95 / 98", mem: 128, acpi: false },
    { id: "win2000", name: "Windows 2000 (Standard PC)", mem: 512, acpi: false },
    { id: "winme", name: "Windows ME (Standard PC)", mem: 512, acpi: false },
    { id: "winxp", name: "Windows XP (Standard PC)", mem: 512, acpi: false }
  ],
  linux: [{ id: "linux_cli", name: "Linux CLI", mem: 256, acpi: true }],
  other: [
    { id: "dos", name: "DOS", mem: 64, acpi: false },
    { id: "boot_cd", name: "Boot from CD (No HDA)", mem: 128, acpi: false }
  ]
};

function setStatus(s, isDirty) { 
  statusEl.textContent = s; 
  statusEl.style.color = isDirty ? "#ff5555" : "#aaa";
  console.log("[Titan1um]", s); 
}

// ---- 渲染 10 个光驱槽位 ----
function renderCdSlots() {
  cdSlotsContainer.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    let slot = cdSlots[i];
    let row = document.createElement("div");
    row.className = "cd-row";
    
    let label = document.createElement("label");
    label.textContent = "CD " + (i + 1) + ":";
    
    let btnInject = document.createElement("button");
    btnInject.className = "file-btn";
    btnInject.textContent = "Inject";
    
    let btnEject = document.createElement("button");
    btnEject.className = "file-btn";
    btnEject.textContent = "Eject";
    btnEject.disabled = true;
    
    let input = document.createElement("input");
    input.type = "file";
    input.className = "hidden-file";
    
    let nameEl = document.createElement("span");
    nameEl.textContent = "(empty)";
    
    slot.input = input;
    slot.nameEl = nameEl;
    slot.btnEject = btnEject;
    
    btnInject.onclick = function() { input.click(); };
    input.onchange = function() {
      if(!input.files.length) return;
      slot.file = input.files[0];
      nameEl.textContent = slot.file.name;
      btnEject.disabled = false;
      updateCdMenuText();
      setStatus("CD " + (i+1) + " changed. Press RESTART.", true);
    };
    btnEject.onclick = function() {
      slot.file = null;
      input.value = "";
      nameEl.textContent = "(empty)";
      btnEject.disabled = true;
      updateCdMenuText();
      setStatus("CD " + (i+1) + " ejected. Press RESTART.", true);
    };
    
    row.appendChild(label);
    row.appendChild(btnInject);
    row.appendChild(btnEject);
    row.appendChild(input);
    row.appendChild(nameEl);
    cdSlotsContainer.appendChild(row);
  }
}

function updateCdMenuText() {
  let count = cdSlots.filter(s => s.file !== null).length;
  btnCdMenu.textContent = `CDs (${count}/10)`;
}

btnCdMenu.onclick = function() { cdPanelOverlay.style.display = "flex"; };
cdPanelOverlay.onclick = function(e) { if(e.target === this) this.style.display = "none"; };

// ---- 系统预设 ----
function updateCategoryMenu() {
  var cat = categorySelect.value;
  presetSelect.innerHTML = "";
  var systems = SYSTEMS[cat] || [];
  systems.forEach(function(sys) {
    var opt = document.createElement("option");
    opt.value = sys.id;
    opt.textContent = sys.name;
    presetSelect.appendChild(opt);
  });
  if (systems.length > 0) {
    presetSelect.value = systems[0].id;
    applyProfile(systems[0]);
  }
}

function applyProfile(sysObj) {
  currentProfile = sysObj;
  memInput.value = sysObj.mem;
  setStatus("Profile changed. Press RESTART.", true);
}

categorySelect.addEventListener("change", updateCategoryMenu);
presetSelect.addEventListener("change", function() {
  var cat = categorySelect.value;
  var sysObj = SYSTEMS[cat].find(s => s.id === presetSelect.value);
  if (sysObj) applyProfile(sysObj);
});

function setButtons(enabled){
  // 完全放开限制
}
function destroyEmulator(){
  if(!emulator) return;
  try{ emulator.stop(); }catch(e){}
  emulator = null;
}

// ---- 缩放控制 ----
function applyScale() {
  var canvas = screenContainer.querySelector("canvas");
  if (!canvas) return;
  
  var scale = scaleSelect.value;
  if (scale === "fit") {
    canvas.style.width = "100%"; canvas.style.height = "100%";
  } else {
    var multiplier = parseInt(scale);
    var baseW = canvas.width || 640; 
    var baseH = canvas.height || 480;
    canvas.style.width = (baseW * multiplier) + "px";
    canvas.style.height = (baseH * multiplier) + "px";
  }
}
scaleSelect.addEventListener("change", applyScale);

// ---- 全屏 ----
btnFullscreen.onclick = function() {
  if (!document.fullscreenElement) screenWrap.requestFullscreen();
  else document.exitFullscreen();
};
document.addEventListener("fullscreenchange", function() {
  if (document.fullscreenElement) document.body.classList.add("is-fullscreen");
  else { document.body.classList.remove("is-fullscreen"); document.body.classList.remove("show-cursor"); }
});
document.addEventListener("keydown", function(e) {
  if (document.body.classList.contains("is-fullscreen") && (e.key === "Alt" || e.key === "Escape" || e.key === "F1")) {
    document.body.classList.toggle("show-cursor");
  }
});

// ---- 面板切换 ----
dlToggle.onclick = function(){
  var isOpen = dlPanel.style.display === "block";
  dlPanel.style.display = isOpen ? "none" : "block";
  dlToggle.textContent = isOpen ? "Images ▼" : "Images ▲";
};

// ---- 挂载 HDA / HDB ----
hdaInput.addEventListener("change", function(){
  if(!hdaInput.files.length) return;
  currentHda = hdaInput.files[0];
  hdaName.textContent = currentHda.name;
  setStatus("HDA changed. Press RESTART.", true); 
});

hdbInput.addEventListener("change", function(){
  if(!hdbInput.files.length) return;
  currentHdb = hdbInput.files[0];
  hdbName.textContent = currentHdb.name;
  setStatus("DATA changed. Press RESTART.", true);
});

// ---- 构建模拟器 ----
function buildEmulator(autoStart){
  destroyEmulator();
  screenContainer.innerHTML = '';
  
  // 核心逻辑：如果选了 boot_cd 且没挂 HDA，塞一个空盘给它
  var hdaBuffer = currentHda;
  if (!hdaBuffer && currentProfile && currentProfile.id === "boot_cd") {
    hdaBuffer = new Uint8Array(0); // 塞个 0 字节的占位空盘
  }

  var memMB = parseInt(memInput.value, 10) || (currentProfile ? currentProfile.mem : 128);

  var opts = {
    wasm_path: "v86.wasm",
    memory_size: memMB * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    acpi: currentProfile ? currentProfile.acpi : false,
    screen_container: screenContainer,
    bios: { url: "seabios.bin" },
    vga_bios: { url: "vgabios.bin" },
    hda: hdaBuffer ? { buffer: hdaBuffer } : undefined,
    autostart: false 
  };

  if (currentHdb) opts.hdb = { buffer: currentHdb };

  var activeCds = [];
  for(let i = 0; i < 10; i++) {
    if (cdSlots[i].file) activeCds.push({ buffer: cdSlots[i].file });
  }
  
  if (activeCds.length > 0) {
    opts.cdrom = activeCds[0];
    if (activeCds.length > 1) opts.cdroms = activeCds;
  }

  try{
    emulator = new V86(opts);
  }catch(e){ 
    setStatus("Build failed: " + e.message); 
    return; 
  }
  
  emulator.add_listener("emulator-ready", function(){ 
    setStatus("Ready (Applied)"); 
    applyScale(); 
  });
  emulator.add_listener("emulator-started", function(){ setStatus("Running"); });
  emulator.add_listener("emulator-stopped", function(){ setStatus("Stopped"); });

  setStatus("Created. Click Start.");
  
  if(autoStart){
    emulator.add_listener("emulator-ready", function(){
      try{ emulator.run(); setStatus("Starting..."); }catch(e){ setStatus("Start failed: " + e.message); }
    });
  }
}

// ---- 控制按钮 ----
btnStart.onclick = function(){ 
  if(!emulator) {
    buildEmulator(true);
  } else {
    try{ emulator.run(); setStatus("Running"); }catch(e){ setStatus("Start failed"); } 
  }
};

btnPause.onclick = function(){ if(emulator){ try{ emulator.stop(); setStatus("Paused"); }catch(e){} } };
btnStop.onclick = function(){ if(emulator){ try{ emulator.stop(); destroyEmulator(); setStatus("Powered Off"); }catch(e){} } };

btnRestart.onclick = function(){ 
  buildEmulator(true);
};

// ---- State ----
btnSave.onclick = async function(){
  if(!emulator) { 
    setStatus("No active VM to save state from."); 
    return; 
  }
  try{
    var state = await emulator.save_state();
    var a = document.createElement("a");
    a.download = "titan1um_state.bin";
    a.href = URL.createObjectURL(new Blob([state]));
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus("State saved");
  }catch(e){ setStatus("Save failed: " + e.message); }
};

btnLoad.onclick = function(){ stateInput.click(); };
stateInput.onchange = function(){
  if(!stateInput.files.length) return;
  if(!emulator) {
    setStatus("Please Start/Restart the VM first before loading state.");
    return;
  }
  var fr = new FileReader();
  fr.onload = async function(e){
    try{
      await emulator.restore_state(e.target.result);
      setStatus("State restored");
    }catch(err){ setStatus("Restore failed: " + err.message); }
  };
  fr.readAsArrayBuffer(stateInput.files[0]);
};

renderCdSlots();
updateCdMenuText();
updateCategoryMenu();
setStatus("Select HDA image or CD to boot");
</script>
</body>
</html>
