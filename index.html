<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Titan1um - Windows 95 Emulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* ---- Global & Layout ---- */
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #ccc;
    font-family: monospace;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* ---- Topbar ---- */
  #topbar {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px 10px;
    background: #111;
    border-bottom: 1px solid #333;
    flex-wrap: wrap;
    font-size: 12px;
    flex-shrink: 0;
  }
  #topbar button, #topbar select, #topbar input[type=number] {
    padding: 3px 8px;
    background: #222;
    color: #ddd;
    border: 1px solid #444;
    cursor: pointer;
    font-size: 12px;
  }
  #topbar button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #topbar label { color: #888; }
  
  /* Brand Logo */
  #brand {
    font-weight: bold;
    color: #4ea8de;
    letter-spacing: 1px;
    margin-right: 10px;
    font-size: 14px;
  }

  #status {
    color: #888;
    margin-left: auto;
  }

  /* ---- Downloader Panel ---- */
  #dl_toggle {
    padding: 3px 10px;
    background: #222;
    color: #ddd;
    border: 1px solid #444;
    cursor: pointer;
    font-size: 12px;
  }
  #dl_panel {
    display: none;
    background: #0a0a0a;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
    height: 340px; 
  }
  #dl_panel iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* ---- Screen Area ---- */
  #screen_wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    position: relative;
  }

  #screen_container {
    white-space: pre;
    font: 14px monospace;
    line-height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  
  #screen_container > div {
    display: none;
  }
  #screen_container > canvas {
    display: block;
    background: #000;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  
  <div id="topbar">
    <div id="brand">Titan1um</div>
    
    <label>HDA:</label><input type="file" id="hda_file" accept=".img,.iso,.bin">
    <label>CD:</label><input type="file" id="cd_file" accept=".iso">
    <label>RAM:</label><input type="number" id="mem_size" value="128" min="16" max="512" step="16" style="width:60px">MB
    <button id="btn_start" disabled>Start</button>
    <button id="btn_pause" disabled>Pause</button>
    <button id="btn_stop" disabled>Stop</button>
    <button id="btn_restart" disabled>Restart</button>
    <button id="btn_save" disabled>Save State</button>
    <input type="file" id="state_file" accept=".bin" style="display:none">
    <button id="btn_load" disabled>Load State</button>
    
    <button id="dl_toggle">Get Image ▼</button>
    <span id="status">Ready</span>
  </div>

  <div id="dl_panel">
    <iframe id="dl_frame" src="downloader.html"></iframe>
  </div>

  <div id="screen_wrap">
    <div id="screen_container">
      <div style="white-space:pre;font:14px monospace;line-height:14px"></div>
      <canvas style="display:none"></canvas>
    </div>
  </div>

<script src="libv86.js"></script>
<script>
var emulator = null;
var statusEl = document.getElementById("status");
var screenContainer = document.getElementById("screen_container");
var btnStart = document.getElementById("btn_start");
var btnPause = document.getElementById("btn_pause");
var btnStop = document.getElementById("btn_stop");
var btnRestart = document.getElementById("btn_restart");
var btnSave = document.getElementById("btn_save");
var btnLoad = document.getElementById("btn_load");
var hdaInput = document.getElementById("hda_file");
var cdInput = document.getElementById("cd_file");
var memInput = document.getElementById("mem_size");
var stateInput = document.getElementById("state_file");

var dlToggle = document.getElementById("dl_toggle");
var dlPanel = document.getElementById("dl_panel");

var currentHda = null;
var currentCd = null;

function setStatus(s){ statusEl.textContent = s; console.log("[Titan1um]", s); }
function setButtons(enabled){
  [btnStart, btnPause, btnStop, btnRestart, btnSave, btnLoad].forEach(function(b){ b.disabled = !enabled; });
}
function destroyEmulator(){
  if(!emulator) return;
  try{ emulator.stop(); }catch(e){}
  emulator = null;
}

// ---- Downloader Panel Toggle ----
dlToggle.onclick = function(){
  var isOpen = dlPanel.style.display === "block";
  dlPanel.style.display = isOpen ? "none" : "block";
  dlToggle.textContent = isOpen ? "Get Image ▼" : "Get Image ▲";
};

// ---- Memory Persistence ----
function loadMemSetting(){
  var v = localStorage.getItem("titan1um_mem");
  if(v) memInput.value = v;
}
function saveMemSetting(){
  localStorage.setItem("titan1um_mem", memInput.value);
}
memInput.addEventListener("change", saveMemSetting);
loadMemSetting();

// ---- Select HDA ----
hdaInput.addEventListener("change", function(){
  if(!hdaInput.files.length) return;
  currentHda = hdaInput.files[0];
  setStatus("Selected HDA: " + currentHda.name);
  buildEmulator(false);
});

// ---- Select CD ----
cdInput.addEventListener("change", function(){
  if(!cdInput.files.length) return;
  currentCd = cdInput.files[0];
  setStatus("Selected CD: " + currentCd.name + ". Rebuilding emulator...");
  if(currentHda) buildEmulator(true);
});

// ---- Build Emulator ----
function buildEmulator(autoStart){
  if(!currentHda){ setStatus("Please select an HDA image first."); return; }
  destroyEmulator();
  
  screenContainer.innerHTML = '<div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas>';
  
  var memMB = parseInt(memInput.value, 10) || 128;

  var opts = {
    wasm_path: "v86.wasm",
    memory_size: memMB * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    screen_container: screenContainer,
    bios: { url: "seabios.bin" },
    vga_bios: { url: "vgabios.bin" },
    hda: { buffer: currentHda },
    autostart: false
  };

  if(currentCd){
    opts.cdrom = { buffer: currentCd };
  }

  try{
    emulator = new V86(opts);
  }catch(e){ 
    setStatus("Build failed: " + e.message); 
    console.error(e); 
    return; 
  }
  
  bindListeners();
  setButtons(true);
  setStatus("Created. Click Start.");
  
  if(autoStart){
    emulator.add_listener("emulator-ready", function(){
      try{ 
        emulator.run(); 
        setStatus("Starting..."); 
      }catch(e){ 
        setStatus("Start failed: " + e.message); 
      }
    });
  }
}

function bindListeners(){
  emulator.add_listener("emulator-ready", function(){ setStatus("Ready"); });
  emulator.add_listener("emulator-started", function(){ setStatus("Running"); });
  emulator.add_listener("emulator-stopped", function(){ setStatus("Stopped"); });
}

// ---- Control Buttons ----
btnStart.onclick = function(){ 
  if(emulator){ 
    try{ emulator.run(); setStatus("Starting..."); }catch(e){ setStatus("Start failed: "+e.message); } 
  } 
};
btnPause.onclick = function(){ 
  if(emulator){ try{ emulator.stop(); setStatus("Paused"); }catch(e){} } 
};
btnStop.onclick = function(){ 
  if(emulator){ try{ emulator.stop(); setStatus("Stopped"); }catch(e){} } 
};
btnRestart.onclick = function(){ 
  if(emulator){ try{ emulator.restart(); setStatus("Restarting..."); }catch(e){} } 
};

// ---- State Save & Load ----
btnSave.onclick = async function(){
  if(!emulator) return;
  try{
    var state = await emulator.save_state();
    var a = document.createElement("a");
    a.download = "titan1um_state.bin";
    a.href = URL.createObjectURL(new Blob([state]));
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus("State saved (" + state.byteLength + " bytes)");
  }catch(e){ setStatus("Save failed: " + e.message); }
};

btnLoad.onclick = function(){ stateInput.click(); };
stateInput.onchange = function(){
  if(!stateInput.files.length || !emulator) return;
  var fr = new FileReader();
  fr.onload = async function(e){
    try{
      await emulator.restore_state(e.target.result);
      setStatus("State restored");
    }catch(err){ setStatus("Restore failed: " + err.message); }
  };
  fr.readAsArrayBuffer(stateInput.files[0]);
};

setStatus("Please select an HDA image");
</script>
</body>
</html>
