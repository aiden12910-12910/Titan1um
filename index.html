<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Titan1um - Web-based x86 Emulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0; padding: 0; background: #000; color: #ccc;
    font-family: monospace; height: 100%; overflow: hidden;
    display: flex; flex-direction: column;
  }
  #topbar {
    display: flex; gap: 6px; align-items: center; padding: 6px 10px;
    background: #111; border-bottom: 1px solid #333;
    flex-wrap: wrap; font-size: 12px; flex-shrink: 0;
  }
  #topbar button, #topbar select, #topbar input[type=number], #topbar input[type=text] {
    padding: 4px 8px; background: #222; color: #ddd;
    border: 1px solid #444; cursor: pointer; font-size: 12px;
  }
  #topbar button:hover:not(:disabled) { background: #333; border-color: #666; }
  #topbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #topbar label { color: #888; margin-left: 4px; }
  #brand { font-weight: bold; color: #4ea8de; letter-spacing: 1px; margin-right: 10px; font-size: 14px; }
  #status { color: #aaa; margin-left: auto; font-weight: bold; }
  
  #dl_toggle { padding: 4px 10px; background: #222; color: #ddd; border: 1px solid #444; cursor: pointer; font-size: 12px; }
  #dl_toggle:hover { background: #333; }
  #dl_panel { display: none; background: #0a0a0a; border-bottom: 1px solid #333; flex-shrink: 0; height: 400px; }
  #dl_panel iframe { width: 100%; height: 100%; border: 0; display: block; }
  
  #screen_wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden; position: relative;
  }
  #screen_container {
    white-space: pre; font: 14px monospace; line-height: 14px;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  #screen_container > div { display: none; }
  #screen_container > canvas {
    display: block; background: #000;
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  body.is-fullscreen #topbar { display: none; }
  body.is-fullscreen #screen_wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; }
  
  .cd-group { display: flex; align-items: center; gap: 4px; border-left: 1px solid #444; padding-left: 8px; margin-left: 4px; }
  .hidden-file { display: none; }
  .file-btn {
    padding: 4px 8px; background: #222; color: #ddd; border: 1px solid #444; cursor: pointer; font-size: 12px; font-family: monospace;
  }
  .file-btn:hover { background: #333; border-color: #666; }
  
  /* 自定义系统输入框默认隐藏 */
  #custom_os_name { display: none; width: 120px; }
</style>
</head>
<body>
  
  <div id="topbar">
    <div id="brand" title="Titan1um Emulator">Titan1um</div>
    
    <label>Category:</label>
    <select id="category_select" title="Select OS Category">
      <option value="windows">Windows</option>
      <option value="linux">Linux</option>
      <option value="android">Android</option>
      <option value="other">Other</option>
    </select>

    <label>Profile:</label>
    <select id="os_preset" title="Select specific OS profile"></select>
    <input type="text" id="custom_os_name" placeholder="Custom OS Name" title="Enter custom OS name (e.g., Win2000)">

    <label>HDA:</label>
    <button class="file-btn" onclick="document.getElementById('hda_file').click()" title="Select Hard Disk Image (HDA)">Choose File</button>
    <input type="file" id="hda_file" class="hidden-file" accept=".img,.iso,.bin">
    <span id="hda_name" style="color:#4ea8de; font-size:11px; max-width:80px; overflow:hidden; text-overflow:ellipsis;" title="Current HDA Image">(none)</span>

    <label>RAM:</label>
    <input type="number" id="mem_size" value="128" min="16" max="512" step="16" style="width:60px" title="Memory size in MB">
    
    <div class="cd-group">
      <label>Floppy:</label>
      <button id="btn_fda_inject" class="file-btn" title="Insert Floppy Image (.img / .ima)">Inject</button>
      <button id="btn_fda_eject" disabled title="Eject Floppy">Eject</button>
      <input type="file" id="fda_file" class="hidden-file" accept=".img,.ima">
      <span id="fda_name" style="color:#4ea8de; max-width: 80px; overflow: hidden; text-overflow: ellipsis;">(empty)</span>
    </div>

    <div class="cd-group">
      <label>CD 1:</label>
      <button id="btn_cd1_inject" class="file-btn" title="Insert CD-ROM Image (.iso) into Slot 1">Inject</button>
      <button id="btn_cd1_eject" disabled title="Eject CD from Slot 1">Eject</button>
      <input type="file" id="cd1_file" class="hidden-file" accept=".iso">
      <span id="cd1_name" style="color:#4ea8de; max-width: 80px; overflow: hidden; text-overflow: ellipsis;">(empty)</span>
    </div>

    <div class="cd-group">
      <label>CD 2:</label>
      <button id="btn_cd2_inject" class="file-btn" title="Insert CD-ROM Image (.iso) into Slot 2">Inject</button>
      <button id="btn_cd2_eject" disabled title="Eject CD from Slot 2">Eject</button>
      <input type="file" id="cd2_file" class="hidden-file" accept=".iso">
      <span id="cd2_name" style="color:#4ea8de; max-width: 80px; overflow: hidden; text-overflow: ellipsis;">(empty)</span>
    </div>

    <button id="btn_start" disabled title="Power On / Resume Emulator">Start</button>
    <button id="btn_pause" disabled title="Pause Emulator (Keeps RAM state)">Pause</button>
    <button id="btn_stop" disabled title="Power Off Emulator">Stop</button>
    <button id="btn_restart" disabled title="Hard Reset (Power Cycle - Safe)">Restart</button>
    
    <button id="btn_save" disabled title="Download Snapshot (State + Disk) to your computer">Save State</button>
    <input type="file" id="state_file" class="hidden-file" accept=".bin">
    <button id="btn_load" disabled title="Load Snapshot from local computer">Load State</button>
    <button id="btn_export_hda" disabled title="Download modified Hard Disk Image (HDA) with all your files" style="color: #4ea8de; border-color: #4ea8de;">Export HDA</button>
    
    <button id="btn_fullscreen" title="Toggle Fullscreen (Theater Mode)">Theater Mode</button>
    <button id="dl_toggle" title="Download Games and OS Images">Images & Games ▼</button>
    <span id="status">Ready</span>
  </div>

  <div id="dl_panel">
    <iframe id="dl_frame" src="downloader.html"></iframe>
  </div>

  <div id="screen_wrap">
    <div id="screen_container">
      <div style="white-space:pre;font:14px monospace;line-height:14px"></div>
      <canvas style="display:none"></canvas>
    </div>
  </div>

<script src="libv86.js"></script>
<script>
var emulator = null;
var statusEl = document.getElementById("status");
var screenContainer = document.getElementById("screen_container");
var screenWrap = document.getElementById("screen_wrap");
var btnStart = document.getElementById("btn_start");
var btnPause = document.getElementById("btn_pause");
var btnStop = document.getElementById("btn_stop");
var btnRestart = document.getElementById("btn_restart");
var btnSave = document.getElementById("btn_save");
var btnLoad = document.getElementById("btn_load");
var btnExportHda = document.getElementById("btn_export_hda");
var btnFullscreen = document.getElementById("btn_fullscreen");
var hdaInput = document.getElementById("hda_file");
var hdaName = document.getElementById("hda_name");
var memInput = document.getElementById("mem_size");
var stateInput = document.getElementById("state_file");
var categorySelect = document.getElementById("category_select");
var presetSelect = document.getElementById("os_preset");
var customOsName = document.getElementById("custom_os_name");
var dlToggle = document.getElementById("dl_toggle");
var dlPanel = document.getElementById("dl_panel");

var fdaInput = document.getElementById("fda_file");
var fdaName = document.getElementById("fda_name");
var btnFdaInject = document.getElementById("btn_fda_inject");
var btnFdaEject = document.getElementById("btn_fda_eject");

var cd1Input = document.getElementById("cd1_file");
var cd1Name = document.getElementById("cd1_name");
var btnCd1Inject = document.getElementById("btn_cd1_inject");
var btnCd1Eject = document.getElementById("btn_cd1_eject");

var cd2Input = document.getElementById("cd2_file");
var cd2Name = document.getElementById("cd2_name");
var btnCd2Inject = document.getElementById("btn_cd2_inject");
var btnCd2Eject = document.getElementById("btn_cd2_eject");

var currentHda = null;
var currentFda = null;
var currentCd1 = null;
var currentCd2 = null;
var currentProfile = null;

// ---- 系统预设数据库 ----
var SYSTEMS = {
  windows: [
    { id: "win95", name: "Windows 95 / 98", mem: 128, acpi: false },
    { id: "winxp", name: "Windows XP (Requires Standard PC)", mem: 512, acpi: false }
  ],
  linux: [
    { id: "linux_cli", name: "Linux CLI (Alpine)", mem: 256, acpi: true }
  ],
  android: [
    { id: "android_x86", name: "Android x86 4.4 (Experimental)", mem: 512, acpi: true }
  ],
  other: [
    { id: "dos", name: "DOS / FreeDOS", mem: 64, acpi: false },
    { id: "kolibrios", name: "KolibriOS", mem: 64, acpi: false },
    { id: "custom", name: "Custom OS (User Defined)", mem: 128, acpi: false }
  ]
};

// ---- 动态渲染下拉菜单 ----
function updateCategoryMenu() {
  var cat = categorySelect.value;
  presetSelect.innerHTML = "";
  customOsName.style.display = "none";
  
  var systems = SYSTEMS[cat] || [];
  systems.forEach(function(sys) {
    var opt = document.createElement("option");
    opt.value = sys.id;
    opt.textContent = sys.name;
    opt.dataset.mem = sys.mem;
    opt.dataset.acpi = sys.acpi;
    presetSelect.appendChild(opt);
  });

  if (systems.length > 0) {
    presetSelect.value = systems[0].id;
    applyProfile(systems[0]);
  }
}

function applyProfile(sysObj) {
  currentProfile = sysObj;
  memInput.value = sysObj.mem;
  
  // 如果选的是自定义，显示输入框
  if (sysObj.id === "custom") {
    customOsName.style.display = "inline-block";
    customOsName.focus();
  } else {
    customOsName.style.display = "none";
  }

  if (currentHda) buildEmulator(false);
}

// ---- 绑定 UI 事件 ----
categorySelect.addEventListener("change", updateCategoryMenu);

presetSelect.addEventListener("change", function() {
  var cat = categorySelect.value;
  var selectedId = presetSelect.value;
  var sysObj = SYSTEMS[cat].find(function(s) { return s.id === selectedId; });
  if (sysObj) applyProfile(sysObj);
});

function setStatus(s){ statusEl.textContent = s; console.log("[Titan1um]", s); }
function setButtons(enabled){
  [btnStart, btnPause, btnStop, btnRestart, btnSave, btnLoad, btnExportHda].forEach(function(b){ b.disabled = !enabled; });
}
function destroyEmulator(){
  if(!emulator) return;
  try{ emulator.stop(); }catch(e){}
  emulator = null;
}

function updateSlotsUI() {
  fdaName.textContent = currentFda ? currentFda.name : "(empty)";
  btnFdaEject.disabled = !currentFda;
  
  cd1Name.textContent = currentCd1 ? currentCd1.name : "(empty)";
  btnCd1Eject.disabled = !currentCd1;

  cd2Name.textContent = currentCd2 ? currentCd2.name : "(empty)";
  btnCd2Eject.disabled = !currentCd2;
}

// ---- 挂载操作 ----
btnFdaInject.onclick = function() { fdaInput.click(); };
fdaInput.onchange = function() {
  if(!fdaInput.files.length) return;
  currentFda = fdaInput.files[0];
  updateSlotsUI();
  if(currentHda) buildEmulator(true);
};
btnFdaEject.onclick = function() {
  currentFda = null; fdaInput.value = ""; updateSlotsUI(); if(currentHda) buildEmulator(true);
};

btnCd1Inject.onclick = function() { cd1Input.click(); };
cd1Input.onchange = function() {
  if(!cd1Input.files.length) return;
  currentCd1 = cd1Input.files[0];
  updateSlotsUI();
  if(currentHda) buildEmulator(true);
};
btnCd1Eject.onclick = function() {
  currentCd1 = null; cd1Input.value = ""; updateSlotsUI(); if(currentHda) buildEmulator(true);
};

btnCd2Inject.onclick = function() { cd2Input.click(); };
cd2Input.onchange = function() {
  if(!cd2Input.files.length) return;
  currentCd2 = cd2Input.files[0];
  updateSlotsUI();
  if(currentHda) buildEmulator(true);
};
btnCd2Eject.onclick = function() {
  currentCd2 = null; cd2Input.value = ""; updateSlotsUI(); if(currentHda) buildEmulator(true);
};

// ---- 全屏 ----
btnFullscreen.onclick = function() {
  if (!document.fullscreenElement) {
    if (screenWrap.requestFullscreen) screenWrap.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
};
document.addEventListener("fullscreenchange", function() {
  if (document.fullscreenElement) {
    document.body.classList.add("is-fullscreen");
  } else {
    document.body.classList.remove("is-fullscreen");
  }
});

// ---- 下载器面板 ----
dlToggle.onclick = function(){
  var isOpen = dlPanel.style.display === "block";
  dlPanel.style.display = isOpen ? "none" : "block";
  dlToggle.textContent = isOpen ? "Images & Games ▼" : "Images & Games ▲";
};

// ---- 选 HDA ----
hdaInput.addEventListener("change", function(){
  if(!hdaInput.files.length) return;
  currentHda = hdaInput.files[0];
  hdaName.textContent = currentHda.name;
  buildEmulator(false);
});

// ---- 构建模拟器 ----
function buildEmulator(autoStart){
  if(!currentHda){ setStatus("Please select an HDA image first."); return; }
  destroyEmulator();
  
  screenContainer.innerHTML = '<div style="white-space:pre;font:14px monospace;line-height:14px"></div><canvas style="display:none"></canvas>';
  
  var memMB = parseInt(memInput.value, 10) || (currentProfile ? currentProfile.mem : 128);
  var useAcpi = currentProfile ? currentProfile.acpi : false;

  var opts = {
    wasm_path: "v86.wasm",
    memory_size: memMB * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    acpi: useAcpi,
    screen_container: screenContainer,
    bios: { url: "seabios.bin" },
    vga_bios: { url: "vgabios.bin" },
    hda: { buffer: currentHda },
    autostart: false
  };

  if (currentFda) opts.fda = { buffer: currentFda };

  var cds = [];
  if (currentCd1) cds.push({ buffer: currentCd1 });
  if (currentCd2) cds.push({ buffer: currentCd2 });
  if (cds.length > 0) {
    opts.cdrom = cds[0];
    if (cds.length > 1) opts.cdroms = cds;
  }

  try{
    emulator = new V86(opts);
  }catch(e){ 
    setStatus("Build failed: " + e.message); 
    return; 
  }
  
  emulator.add_listener("emulator-ready", function(){ setStatus("Ready"); });
  emulator.add_listener("emulator-started", function(){ setStatus("Running"); });
  emulator.add_listener("emulator-stopped", function(){ setStatus("Stopped"); });

  setButtons(true);
  setStatus("Created. Click Start.");
  
  if(autoStart){
    emulator.add_listener("emulator-ready", function(){
      try{ emulator.run(); setStatus("Starting..."); }catch(e){ setStatus("Start failed: " + e.message); }
    });
  }
}

// ---- 控制按钮 ----
btnStart.onclick = function(){ if(emulator){ try{ emulator.run(); setStatus("Running"); }catch(e){ setStatus("Start failed"); } } };
btnPause.onclick = function(){ if(emulator){ try{ emulator.stop(); setStatus("Paused"); }catch(e){} } };
btnStop.onclick = function(){ if(emulator){ try{ emulator.stop(); setStatus("Stopped"); }catch(e){} } };

btnRestart.onclick = function(){ 
  if(emulator){ 
    try{ 
      emulator.restart(); 
      setStatus("Hard Resetting..."); 
    }catch(e){
      setStatus("Reset failed");
    } 
  } 
};

// ---- State 下载 / 加载 ----
btnSave.onclick = async function(){
  if(!emulator) return;
  try{
    var state = await emulator.save_state();
    var a = document.createElement("a");
    a.download = "titan1um_state.bin";
    a.href = URL.createObjectURL(new Blob([state]));
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus("State saved");
  }catch(e){ setStatus("Save failed: " + e.message); }
};

btnLoad.onclick = function(){ stateInput.click(); };
stateInput.onchange = function(){
  if(!stateInput.files.length || !emulator) return;
  var fr = new FileReader();
  fr.onload = async function(e){
    try{
      await emulator.restore_state(e.target.result);
      setStatus("State restored");
    }catch(err){ setStatus("Restore failed: " + err.message); }
  };
  fr.readAsArrayBuffer(stateInput.files[0]);
};

// ---- 扒下 HDA 镜像 ----
btnExportHda.onclick = function(){
  if(!emulator) return;
  try {
    var ide = emulator.v86.cpu.devices.ide;
    if (!ide || !ide.primary || !ide.primary.master) throw new Error("HDA device not found.");
    var buffer = ide.primary.master.buffer;
    if (!buffer || buffer.length === 0) throw new Error("HDA buffer is empty.");

    var a = document.createElement("a");
    a.download = "exported_hda.img";
    a.href = URL.createObjectURL(new Blob([buffer], { type: "application/octet-stream" }));
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus("HDA Exported successfully (" + (buffer.length / 1024 / 1024).toFixed(2) + " MB)");
  } catch(e) {
    setStatus("Export failed: " + e.message);
  }
};

updateCategoryMenu();
updateSlotsUI();
setStatus("Select an HDA image");
</script>
</body>
</html>
