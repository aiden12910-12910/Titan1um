<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HF 镜像下载器</title>
<style>
  body{margin:0;padding:16px;background:#0a0a0a;color:#ddd;font-family:monospace;font-size:13px}
  h1{font-size:16px;margin:0 0 12px;color:#eee}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  label{color:#888}
  select{padding:5px 8px;background:#1a1a1a;color:#ddd;border:1px solid #444;font-family:monospace;font-size:13px;min-width:300px}
  button{padding:5px 14px;background:#222;color:#ddd;border:1px solid #444;cursor:pointer;font-family:monospace;font-size:13px}
  button:disabled{opacity:.4;cursor:not-allowed}
  #file_list{background:#000;border:1px solid #333;padding:8px;max-height:120px;overflow:auto;margin:6px 0 10px;font-size:12px;line-height:1.6}
  #file_list .file_item{padding:3px 6px;cursor:pointer;border-radius:3px}
  #file_list .file_item:hover{background:#1a2a3a}
  #file_list .file_item.selected{background:#1e3a5f;color:#fff}
  #bar{height:8px;background:#333;border-radius:4px;overflow:hidden;margin:10px 0}
  #bar-fill{height:100%;width:0;background:#4a9eff;transition:width .2s}
  #log{background:#000;border:1px solid #333;padding:8px;height:120px;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.5}
  .hint{color:#666;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>HF 镜像下载器</h1>

<div class="row">
  <label>仓库:</label>
  <select id="repo_select"></select>
</div>

<div id="file_list">点仓库下拉，文件列表会显示在这里</div>

<div class="row">
  <button id="btn_download" type="button" disabled>下载选中文件</button>
  <button id="btn_save" type="button" disabled>保存到本地</button>
</div>

<div id="bar"><div id="bar-fill"></div></div>
<div id="log"></div>

<p class="hint">
  文件列表硬编码，不走 HF API，避免 CORS 和大小写 404。<br>
  下载走 HF resolve 直链；如果仍报 CORS，需要 Worker 代理。
</p>

<script>
// ---- 硬编码：仓库 → 文件列表（你以后加文件只改这里） ----
var HF_REPOS = {
  "Aiden12910/Windows-web-sim-file-support": ["windows95.img"]
};

var repoSelect = document.getElementById("repo_select");
var fileListEl = document.getElementById("file_list");
var btnDownload = document.getElementById("btn_download");
var btnSave = document.getElementById("btn_save");
var barFill = document.getElementById("bar-fill");
var logEl = document.getElementById("log");

var selectedFile = null;
var downloadedBlob = null;
var downloadedName = "";

function log(s){
  logEl.textContent += s + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function setProgress(pct){
  barFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
}

// ---- 填充仓库下拉 ----
Object.keys(HF_REPOS).forEach(function(r){
  var opt = document.createElement("option");
  opt.value = r;
  opt.textContent = r;
  repoSelect.appendChild(opt);
});

// ---- 仓库切换时渲染文件列表 ----
repoSelect.onchange = function(){
  renderFileList(repoSelect.value);
};

function renderFileList(repo){
  selectedFile = null;
  downloadedBlob = null;
  btnDownload.disabled = true;
  btnSave.disabled = true;
  setProgress(0);
  var files = HF_REPOS[repo] || [];
  fileListEl.innerHTML = "";
  if(!files.length){
    fileListEl.textContent = "该仓库没有预设文件";
    return;
  }
  files.forEach(function(f){
    var div = document.createElement("div");
    div.className = "file_item";
    div.textContent = f;
    div.onclick = function(){
      Array.prototype.forEach.call(fileListEl.children, function(c){ c.classList.remove("selected"); });
      div.classList.add("selected");
      selectedFile = f;
      btnDownload.disabled = false;
      log("选中: " + f);
    };
    fileListEl.appendChild(div);
  });
  log("仓库 " + repo + " 有 " + files.length + " 个文件，点一个选中");
}

// 初始化
renderFileList(repoSelect.value);

// ---- 下载选中文件 ----
btnDownload.onclick = async function(){
  if(!selectedFile){ log("请先选中一个文件"); return; }
  var repo = repoSelect.value;
  // 注意：路径用原始大小写，HF 对用户名大小写敏感
  var url = "https://huggingface.co/" + repo + "/resolve/main/" + encodeURIComponent(selectedFile);
  log("开始下载: " + url);
  btnDownload.disabled = true;
  btnSave.disabled = true;
  downloadedBlob = null;
  setProgress(0);

  try{
    var resp = await fetch(url);
    if(!resp.ok) throw new Error("HTTP " + resp.status + " " + resp.statusText);
    var total = parseInt(resp.headers.get("Content-Length") || "0", 10);
    var reader = resp.body.getReader();
    var chunks = [];
    var received = 0;
    var lastLog = 0;

    while(true){
      var {done, value} = await reader.read();
      if(done) break;
      chunks.push(value);
      received += value.length;
      if(total > 0){
        setProgress(received / total * 100);
        if(received - lastLog > 1024 * 1024){
          log("已下载 " + (received/1024/1024).toFixed(1) + " / " + (total/1024/1024).toFixed(1) + " MB");
          lastLog = received;
        }
      }else{
        log("已下载 " + (received/1024/1024).toFixed(1) + " MB（总大小未知）");
      }
    }

    downloadedBlob = new Blob(chunks);
    downloadedName = selectedFile.split("/").pop() || "image.img";
    log("下载完成: " + downloadedBlob.size + " bytes");
    btnSave.disabled = false;
  }catch(e){
    log("下载失败: " + e.message);
    log("如果是 CORS 错误，说明 HF CDN 不允许跨域，需要 Worker 代理。");
  }finally{
    btnDownload.disabled = false;
  }
};

// ---- 保存到本地 ----
btnSave.onclick = function(){
  if(!downloadedBlob) return;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(downloadedBlob);
  a.download = downloadedName;
  a.click();
  URL.revokeObjectURL(a.href);
  log("已保存到本地: " + downloadedName);
};
</script>
</body>
</html>
